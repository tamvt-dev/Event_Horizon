; EventHorizon Engine - ESP32 Platform Configuration
; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Build configuration
build_flags = 
    -O3
    -std=c99
    -Wall
    -Wextra
    -DESP32_PLATFORM
    -DEH_ARENA_SIZE=512*1024          ; 512KB arena for ESP32
    -DEH_MAX_NODES=128                 ; Reduced from 256
    -DEH_BEAM_WIDTH=2                  ; Keep lightweight
    -DEH_MAX_BEAM_DEPTH=8              ; Reduced from 16
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections                  ; Link-time optimization
    -mfix-esp32-psram-cache-issue      ; PSRAM stability
    
; Source files
build_src_filter = 
    +<../../src/core/>
    +<esp32_main.c>
    +<esp32_port.c>

; Include directories
build_flags = 
    -I../../include
    -Iinclude

; Monitor configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize

; Upload configuration
upload_speed = 921600

; PSRAM configuration (for larger models)
[env:esp32dev_psram]
extends = env:esp32dev
board_build.partitions = huge_app.csv
build_flags = 
    ${env:esp32dev.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DEH_ARENA_SIZE=2*1024*1024        ; 2MB with PSRAM

; ESP32-S3 (newer, faster)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_flags = 
    ${env:esp32dev.build_flags}
    -DESP32S3_PLATFORM
    -DEH_ARENA_SIZE=1*1024*1024        ; 1MB arena

; ESP32-C3 (RISC-V, low power)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
build_flags = 
    ${env:esp32dev.build_flags}
    -DESP32C3_PLATFORM
    -DRISCV_PLATFORM
    -DEH_ARENA_SIZE=256*1024           ; 256KB arena (limited RAM)
    -DEH_MAX_NODES=64                  ; Further reduced
